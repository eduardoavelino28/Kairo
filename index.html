<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairo</title>
<style>
:root{
  --bg-primary:#0d0b1e;
  --bg-secondary:#161328;
  --bg-card:#1c1836;
  --accent-purple:#8b5cf6;
  --accent-glow:#b347f2;
  --accent-warm:#f4c542;
  --accent-coral:#ff6b6b;
  --text-primary:#f0eefc;
  --text-secondary:#a8a3c9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font-family:'Segoe UI',Roboto,sans-serif;
  padding-bottom:70px;
  min-height:100vh;
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(13,11,30,0.95);
  backdrop-filter:blur(8px);
  padding:14px 16px 10px;
  border-bottom:1px solid rgba(139,92,246,0.2);
}
.logo{
  font-size:26px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent-purple),var(--accent-glow));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 20px rgba(179,71,242,0.5);
  margin-bottom:10px;
}
.search-bar{
  display:flex;gap:8px;align-items:center;
  background:var(--bg-secondary);border:1px solid rgba(139,92,246,0.3);
  border-radius:12px;padding:10px 14px;
}
.search-bar input{
  flex:1;background:transparent;border:none;color:var(--text-primary);
  font-size:15px;outline:none;
}
.search-bar input::placeholder{color:var(--text-secondary);}
.filters{
  display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;
}
.filters select{
  background:var(--bg-secondary);color:var(--text-secondary);
  border:1px solid rgba(139,92,246,0.25);border-radius:20px;
  padding:6px 10px;font-size:12px;white-space:nowrap;
}
.section-title{
  font-size:17px;font-weight:700;margin:20px 16px 10px;
  display:flex;align-items:center;gap:6px;
}
.section-title::before{
  content:'';width:4px;height:16px;background:var(--accent-warm);border-radius:2px;
}
.carousel{
  display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;
  scroll-snap-type:x mandatory;
}
.anime-card{
  flex:0 0 128px;scroll-snap-align:start;cursor:pointer;
}
.card-cover{
  position:relative;width:128px;height:180px;border-radius:12px;overflow:hidden;
  background:var(--bg-card);box-shadow:0 4px 14px rgba(0,0,0,0.4);
}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.card-score{
  position:absolute;top:6px;left:6px;
  background:rgba(13,11,30,0.85);color:var(--accent-warm);
  font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px;
}
.fav-btn{
  position:absolute;top:6px;right:6px;
  background:rgba(13,11,30,0.7);border:none;color:var(--text-secondary);
  width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer;
}
.fav-btn.active{color:var(--accent-coral);}
.card-title{
  font-size:12.5px;margin-top:6px;color:var(--text-primary);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.grid-view{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:14px;padding:8px 16px;
}
.hidden{display:none !important;}
.spinner{
  width:28px;height:28px;margin:30px auto;border-radius:50%;
  border:3px solid rgba(139,92,246,0.2);border-top-color:var(--accent-purple);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-msg{color:var(--text-secondary);text-align:center;padding:30px;font-size:14px;}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;background:rgba(22,19,40,0.97);backdrop-filter:blur(10px);
  border-top:1px solid rgba(139,92,246,0.2);
}
.bottom-nav button{
  flex:1;background:none;border:none;color:var(--text-secondary);
  padding:12px 0;font-size:12px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;
}
.bottom-nav button.active{color:var(--accent-glow);}
.bottom-nav .icon{font-size:18px;}
#detailView{padding-bottom:20px;}
.detail-back{
  position:sticky;top:0;z-index:40;background:rgba(13,11,30,0.9);
  padding:12px 16px;font-size:15px;color:var(--text-primary);cursor:pointer;
}
.detail-cover-wrap{width:100%;height:280px;position:relative;overflow:hidden;}
.detail-cover-wrap img{width:100%;height:100%;object-fit:cover;}
.detail-cover-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(transparent,var(--bg-primary));
}
.detail-body{padding:16px;}
.detail-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.detail-meta{
  display:flex;gap:10px;flex-wrap:wrap;color:var(--text-secondary);
  font-size:13px;margin-bottom:12px;
}
.detail-score{color:var(--accent-warm);font-weight:700;}
.detail-fav-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-card);border:1px solid var(--accent-purple);
  color:var(--text-primary);padding:8px 16px;border-radius:20px;
  font-size:13px;margin-bottom:16px;cursor:pointer;
}
.detail-fav-btn.active{
  background:var(--accent-coral);border-color:var(--accent-coral);color:#1a0808;
}
.genre-tag{
  display:inline-block;background:var(--bg-card);color:var(--accent-glow);
  font-size:11px;padding:4px 10px;border-radius:12px;margin:0 6px 6px 0;
}
.detail-synopsis{
  font-size:14px;line-height:1.6;color:var(--text-secondary);margin-bottom:16px;
}
.char-carousel{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.char-item{flex:0 0 70px;text-align:center;}
.char-item img{
  width:70px;height:70px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(139,92,246,0.3);
}
.char-item span{font-size:10.5px;color:var(--text-secondary);display:block;margin-top:4px;}
.trailer-wrap{
  position:relative;width:100%;padding-top:56.25%;border-radius:12px;
  overflow:hidden;margin-top:8px;background:var(--bg-card);
}
.trailer-wrap iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;border:none;
}
</style>
</head>
<body>
<header>
  <div class="logo">Kairo</div>
  <div class="search-bar">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar anime...">
  </div>
  <div class="filters">
    <select id="filterGenre"><option value="">Gênero</option></select>
    <select id="filterType">
      <option value="">Tipo</option>
      <option value="tv">TV</option>
      <option value="movie">Filme</option>
      <option value="ova">OVA</option>
      <option value="special">Especial</option>
    </select>
    <select id="filterStatus">
      <option value="">Status</option>
      <option value="airing">Em exibição</option>
      <option value="complete">Completo</option>
      <option value="upcoming">Em breve</option>
    </select>
  </div>
</header>
<main id="app">

<div id="homeView">
  <div class="section-title">Em Alta</div>
  <div class="carousel" id="trendingCarousel"><div class="spinner"></div></div>
  <div class="section-title">Populares da Temporada</div>
  <div class="carousel" id="seasonCarousel"><div class="spinner"></div></div>
  <div class="section-title">Top Ranking</div>
  <div class="carousel" id="topCarousel"><div class="spinner"></div></div>
</div>

<div id="searchView" class="hidden">
  <div class="section-title">Resultados</div>
  <div class="grid-view" id="searchGrid"></div>
</div>

<div id="favView" class="hidden">
  <div class="section-title">Meus Favoritos</div>
  <div class="grid-view" id="favGrid"></div>
</div>

<div id="detailView" class="hidden">
  <div class="detail-back" onclick="closeDetail()">← Voltar</div>
  <div id="detailContent"></div>
</div>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="home"><span class="icon">🏠</span>Início</button>
  <button class="nav-btn" data-view="fav"><span class="icon">⭐</span>Favoritos</button>
</nav>
<script>
const JIKAN_BASE = 'https://api.jikan.moe/v4';
let favorites = JSON.parse(localStorage.getItem('kairo_favs') || '[]');
let searchTimeout = null;
let currentDetailId = null;
const animeCache = {};

function isFav(id){ return favorites.some(f => f.mal_id === id); }

function toggleFav(anime, btnEl){
  const idx = favorites.findIndex(f => f.mal_id === anime.mal_id);
  if(idx >= 0){ favorites.splice(idx,1); }
  else{ favorites.push({mal_id:anime.mal_id,title:anime.title,image:anime.images?.jpg?.image_url,score:anime.score}); }
  localStorage.setItem('kairo_favs', JSON.stringify(favorites));
  if(btnEl) btnEl.classList.toggle('active');
}

async function jikanFetch(endpoint, retries = 2){
  for(let attempt = 0; attempt <= retries; attempt++){
    try{
      const res = await fetch(JIKAN_BASE + endpoint);
      if(res.status === 429){
        await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
        continue;
      }
      if(!res.ok) throw new Error('Erro na API');
      const data = await res.json();
      return data.data || [];
    }catch(e){
      if(attempt === retries){
        console.error(e);
        return [];
      }
      await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
    }
  }
  return [];
}

function cacheAnime(list){ list.forEach(a => animeCache[a.mal_id] = a); }

function quickFav(id, btnEl){
  const anime = animeCache[id];
  if(anime) toggleFav(anime, btnEl);
}

function cardHTML(anime){
  const cover = anime.images?.jpg?.image_url || '';
  const score = anime.score ? anime.score.toFixed(1) : '—';
  const favClass = isFav(anime.mal_id) ? 'active' : '';
  return `
    <div class="anime-card" onclick="openDetail(${anime.mal_id})">
      <div class="card-cover">
        <img src="${cover}" loading="lazy">
        <div class="card-score">★ ${score}</div>
        <button class="fav-btn ${favClass}" onclick="event.stopPropagation(); quickFav(${anime.mal_id}, this)">♥</button>
      </div>
      <div class="card-title">${anime.title}</div>
    </div>`;
}

async function loadHome(){
  const trending = await jikanFetch('/top/anime?filter=airing&limit=12');
  cacheAnime(trending);
  document.getElementById('trendingCarousel').innerHTML = trending.map(cardHTML).join('') || '<div class="empty-msg">Nada encontrado</div>';

  await new Promise(r => setTimeout(r, 400));
  const season = await jikanFetch('/seasons/now?limit=12');
  cacheAnime(season);
  document.getElementById('seasonCarousel').innerHTML = season.map(cardHTML).join('') || '<div class="empty-msg">Nada encontrado</div>';

  await new Promise(r => setTimeout(r, 400));
  const top = await jikanFetch('/top/anime?limit=12');
  cacheAnime(top);
  document.getElementById('topCarousel').innerHTML = top.map(cardHTML).join('') || '<div class="empty-msg">Nada encontrado</div>';
}

async function loadGenres(){
  const genres = await fetch(JIKAN_BASE + '/genres/anime').then(r=>r.json()).then(d=>d.data||[]).catch(()=>[]);
  const sel = document.getElementById('filterGenre');
  genres.slice(0,25).forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g.mal_id; opt.textContent = g.name;
    sel.appendChild(opt);
  });
}

async function runSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const genre = document.getElementById('filterGenre').value;
  const type = document.getElementById('filterType').value;
  const status = document.getElementById('filterStatus').value;

  if(!q && !genre && !type && !status){
    showView('home');
    return;
  }
  showView('search');
  const grid = document.getElementById('searchGrid');
  grid.innerHTML = '<div class="spinner"></div>';

  let url = '/anime?limit=24';
  if(q) url += '&q=' + encodeURIComponent(q);
  if(genre) url += '&genres=' + genre;
  if(type) url += '&type=' + type;
  if(status) url += '&status=' + status;

  const results = await jikanFetch(url);
  cacheAnime(results);
  grid.innerHTML = results.map(cardHTML).join('') || '<div class="empty-msg">Nenhum anime encontrado 😕</div>';
}

document.getElementById('searchInput').addEventListener('input', ()=>{
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(runSearch, 600);
});
['filterGenre','filterType','filterStatus'].forEach(id=>{
  document.getElementById(id).addEventListener('change', runSearch);
});

async function openDetail(id){
  currentDetailId = id;
  showView('detail');
  const content = document.getElementById('detailContent');
  content.innerHTML = '<div class="spinner"></div>';

  const full = await jikanFetch(`/anime/${id}/full`);
  const anime = Array.isArray(full) ? full[0] : full;
  if(!anime){ content.innerHTML = '<div class="empty-msg">Erro ao carregar 😕</div>'; return; }
  animeCache[id] = anime;

  const chars = await jikanFetch(`/anime/${id}/characters`);
  const cover = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const score = anime.score ? anime.score.toFixed(1) : '—';
  const genres = (anime.genres||[]).map(g=>`<span class="genre-tag">${g.name}</span>`).join('');
  const favActive = isFav(id) ? 'active' : '';
  const ytId = anime.trailer?.youtube_id;

  const charsHTML = chars.slice(0,10).map(c=>`
    <div class="char-item">
      <img src="${c.character?.images?.jpg?.image_url || ''}" loading="lazy">
      <span>${c.character?.name || ''}</span>
    </div>`).join('');

  content.innerHTML = `
    <div class="detail-cover-wrap"><img src="${cover}"></div>
    <div class="detail-body">
      <div class="detail-title">${anime.title}</div>
      <div class="detail-meta">
        <span class="detail-score">★ ${score}</span>
        <span>${anime.type || '—'}</span>
        <span>${anime.episodes ? anime.episodes + ' eps' : '—'}</span>
        <span>${anime.status || '—'}</span>
      </div>
      <button class="detail-fav-btn ${favActive}" onclick="toggleDetailFav(${id}, this)">♥ ${favActive ? 'Favoritado' : 'Favoritar'}</button>
      <div>${genres}</div>
      <div class="detail-synopsis">${anime.synopsis || 'Sem sinopse disponível.'}</div>
      ${charsHTML ? `<div class="section-title" style="margin:0 0 8px">Personagens</div><div class="char-carousel">${charsHTML}</div>` : ''}
      ${ytId ? `<div class="section-title" style="margin:16px 0 8px">Trailer</div>
        <div class="trailer-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>` : ''}
    </div>`;
}

function toggleDetailFav(id, btnEl){
  const anime = animeCache[id];
  toggleFav(anime, null);
  const active = isFav(id);
  btnEl.classList.toggle('active', active);
  btnEl.innerHTML = `♥ ${active ? 'Favoritado' : 'Favoritar'}`;
}

function closeDetail(){ showView('home'); }

function loadFavView(){
  const grid = document.getElementById('favGrid');
  if(!favorites.length){ grid.innerHTML = '<div class="empty-msg">Você ainda não favoritou nenhum anime ⭐</div>'; return; }
  grid.innerHTML = favorites.map(f => `
    <div class="anime-card" onclick="openDetail(${f.mal_id})">
      <div class="card-cover">
        <img src="${f.image||''}" loading="lazy">
        <div class="card-score">★ ${f.score ? f.score.toFixed(1) : '—'}</div>
      </div>
      <div class="card-title">${f.title}</div>
    </div>`).join('');
}

function showView(view){
  document.getElementById('homeView').classList.toggle('hidden', view!=='home');
  document.getElementById('searchView').classList.toggle('hidden', view!=='search');
  document.getElementById('favView').classList.toggle('hidden', view!=='fav');
  document.getElementById('detailView').classList.toggle('hidden', view!=='detail');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='fav') loadFavView();
  window.scrollTo(0,0);
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});

loadHome();
loadGenres();
</script>
</body>
</html>
