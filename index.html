<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairo — Catálogo de anime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo-box">K</div>
  <div class="logo-text"><span class="kai">Kai</span><span class="ro">ro</span></div>
  <div class="search-bar"><span>🔍</span><input type="text" id="searchInput" placeholder="Buscar anime..."></div>
</header>
<div class="nav-row">
  <button class="nav-link active" data-view="home">Início</button>
  <button class="nav-link" data-view="genres">Gêneros</button>
  <button class="nav-link" data-view="populares">Populares</button>
  <button class="nav-link" data-view="fav">Minha Lista</button>
</div>
<main id="app">

<div id="homeView">
  <div class="hero" id="heroBanner"><div class="spinner"></div></div>

  <div class="category-chips" data-scope="home">
    <button class="chip active" data-genre="">Todos</button>
    <button class="chip" data-genre="1">Ação</button>
    <button class="chip" data-genre="4">Comédia</button>
    <button class="chip" data-genre="22">Romance</button>
    <button class="chip" data-genre="24">Sci-Fi</button>
  </div>

  <div id="generalSections">
    <div class="section-title">Lançamentos da Temporada</div>
    <div class="carousel" id="seasonCarousel"><div class="spinner"></div></div>
    <div class="section-title">Mais Assistidos</div>
    <div class="carousel" id="topCarousel"><div class="spinner"></div></div>
  </div>

  <div id="genreSectionsHome">
    <div class="genre-section" data-genre="1">
      <div class="section-title">Ação</div>
      <div class="carousel" id="genreCarousel-home-1"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="4">
      <div class="section-title">Comédia</div>
      <div class="carousel" id="genreCarousel-home-4"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="22">
      <div class="section-title">Romance</div>
      <div class="carousel" id="genreCarousel-home-22"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="24">
      <div class="section-title">Sci-Fi</div>
      <div class="carousel" id="genreCarousel-home-24"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="genresView" class="hidden">
  <div class="section-title" style="margin-top:20px;">Gêneros</div>
  <div class="section-subtitle">Descubra títulos por gênero, nota e popularidade.</div>
  <div class="category-chips" data-scope="genres">
    <button class="chip active" data-genre="">Todos</button>
    <button class="chip" data-genre="1">Ação</button>
    <button class="chip" data-genre="4">Comédia</button>
    <button class="chip" data-genre="22">Romance</button>
    <button class="chip" data-genre="24">Sci-Fi</button>
  </div>
  <div id="todosGenerosBlock">
    <div class="section-title">Todos os gêneros</div>
    <div class="grid-view" id="todosGenerosGrid"><div class="spinner"></div></div>
  </div>
  <div id="genreSectionsPage">
    <div class="genre-section" data-genre="1">
      <div class="section-title">Ação</div>
      <div class="carousel" id="genreCarousel-page-1"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="4">
      <div class="section-title">Comédia</div>
      <div class="carousel" id="genreCarousel-page-4"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="22">
      <div class="section-title">Romance</div>
      <div class="carousel" id="genreCarousel-page-22"><div class="spinner"></div></div>
    </div>
    <div class="genre-section" data-genre="24">
      <div class="section-title">Sci-Fi</div>
      <div class="carousel" id="genreCarousel-page-24"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="popularesView" class="hidden">
  <div class="section-title" style="margin-top:20px;">🔥 Populares</div>
  <div class="section-subtitle">Títulos mais bem avaliados pela comunidade.</div>
  <div class="grid-view" id="popularesGrid"><div class="spinner"></div></div>
</div>

<div id="searchView" class="hidden">
  <div class="section-title" style="margin-top:20px;">Resultados</div>
  <div class="grid-view" id="searchGrid"></div>
</div>

<div id="favView" class="hidden">
  <div class="section-title" style="margin-top:20px;">⭐ Minha Lista</div>
  <div class="grid-view" id="favGrid"></div>
</div>

</main>

<footer>Kairo — Catálogo de anime.</footer>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this) closeDetail()">
  <div class="modal-card">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
