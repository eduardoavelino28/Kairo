<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="KAIRO — Detalhes do anime.">

    <title>KAIRO — Anime</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">

        <a href="index.html" class="logo">
            <span class="logo-icon">K</span>
            <span>KAIRO</span>
        </a>

        <nav class="nav">
            <a href="index.html#inicio">Início</a>
            <a href="index.html#populares">Populares</a>
            <a href="index.html#avaliados">Mais avaliados</a>
            <a href="index.html#lancamentos">Lançamentos</a>
        </nav>

        <button class="menu-button" id="menu-button" aria-label="Abrir menu">
            ☰
        </button>

    </header>


    <!-- CONTEÚDO -->
    <main class="anime-page">

        <section class="anime-details">

            <div id="anime-loading" class="loading">
                Carregando informações...
            </div>

            <div id="anime-content" class="anime-content hidden">

                <div class="anime-cover">
                    <img id="anime-image" src="" alt="">
                </div>


                <div class="anime-main-info">

                    <span class="anime-type" id="anime-type">
                        Anime
                    </span>

                    <h1 id="anime-title">
                        Carregando...
                    </h1>

                    <div class="anime-meta">

                        <span id="anime-rating">
                            ⭐ —
                        </span>

                        <span id="anime-episodes">
                            🎬 —
                        </span>

                        <span id="anime-year">
                            📅 —
                        </span>

                        <span id="anime-status">
                            —
                        </span>

                    </div>


                    <div id="anime-genres" class="genres"></div>


                    <p id="anime-synopsis" class="anime-synopsis">
                        Carregando sinopse...
                    </p>


                    <button id="favorite-button" class="button primary">
                        ＋ Minha lista
                    </button>

                </div>

            </div>

        </section>


        <!-- TRAILER -->
        <section id="trailer-section" class="anime-section hidden">

            <div class="section-header">

                <div class="section-title">
                    <span class="section-label">▶</span>

                    <div>
                        <h2>Trailer</h2>
                        <span class="section-description">
                            Assista ao trailer do anime
                        </span>
                    </div>
                </div>

            </div>

            <div class="trailer-container">
                <iframe
                    id="anime-trailer"
                    src=""
                    title="Trailer do anime"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <strong>KAIRO</strong>

        <p>
            Seu universo de anime.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
